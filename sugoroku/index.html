<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ナルトすごろく">
    <meta name="theme-color" content="#ff6b00">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="192x192" href="../assets/icons/icon-192.png">
    <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
    <title>ナルト すごろく だいぼうけん！</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100dvh;
            max-height: 100dvh;
            overflow: hidden;
            font-family: 'M PLUS Rounded 1c', sans-serif;
            background-color: #0b0e17;
            color: #fff;
            user-select: none;
        }

        .text-outline {
            text-shadow:
                -1.5px -1.5px 0 #000,
                 1.5px -1.5px 0 #000,
                -1.5px  1.5px 0 #000,
                 1.5px  1.5px 0 #000,
                 0 2px 5px rgba(0,0,0,0.85);
        }

        .text-outline-sm {
            text-shadow:
                -1px -1px 0 #000,
                 1px -1px 0 #000,
                -1px  1px 0 #000,
                 1px  1px 0 #000;
        }

        /* ポヨン！と跳ねるコマアニメ */
        @keyframes poyonHop {
            0%   { transform: translateY(0) scale(1); }
            35%  { transform: translateY(-18px) scale(1.22); }
            70%  { transform: translateY(2px) scale(0.92, 1.08); }
            100% { transform: translateY(0) scale(1); }
        }
        .token-hopping {
            animation: poyonHop 0.34s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 40 !important;
        }

        /* 順番プレイヤーのキラキラ枠 */
        @keyframes activeTurnPulse {
            0%, 100% { box-shadow: 0 0 10px #fde047, inset 0 0 8px rgba(253, 224, 71, 0.35); transform: translateY(0); }
            50%      { box-shadow: 0 0 22px #f97316, inset 0 0 14px rgba(251, 191, 36, 0.65); transform: translateY(-2px); }
        }
        .turn-card-active {
            animation: activeTurnPulse 1.1s ease-in-out infinite;
        }

        /* きゅうびチャクラ黄金オーラ */
        @keyframes kyuubiGlow {
            0%, 100% { box-shadow: 0 0 14px #fbbf24, 0 0 28px #ea580c; }
            50%      { box-shadow: 0 0 26px #fef08a, 0 0 42px #ef4444; }
        }
        .kyuubi-aura {
            animation: kyuubiGlow 0.8s ease-in-out infinite;
        }

        /* ボス関門の赤黒パルス */
        @keyframes bossPulse {
            0%, 100% { box-shadow: 0 0 10px rgba(239, 68, 68, 0.75), inset 0 0 8px rgba(220, 38, 38, 0.45); }
            50%      { box-shadow: 0 0 20px rgba(248, 113, 113, 1), inset 0 0 14px rgba(239, 68, 68, 0.8); }
        }
        .tile-boss-gate {
            animation: bossPulse 1.4s infinite;
        }

        /* ゴールマスの虹色黄金パルス */
        @keyframes goalShine {
            0%, 100% { box-shadow: 0 0 14px #fde047, inset 0 0 10px rgba(254, 240, 138, 0.6); }
            50%      { box-shadow: 0 0 28px #f59e0b, inset 0 0 18px rgba(255, 255, 255, 0.9); }
        }
        .tile-goal-glow {
            animation: goalShine 1.2s infinite;
        }

        /* 鈴のゆらゆらアニメ */
        @keyframes bellSwing {
            0%, 100% { transform: rotate(-10deg); }
            50%      { transform: rotate(10deg); }
        }
        .bell-wobble {
            animation: bellSwing 0.9s ease-in-out infinite;
            transform-origin: top center;
        }

        /* 手裏剣ルーレット回転 */
        @keyframes spinFast {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }
        .shuriken-spinning {
            animation: spinFast 0.26s linear infinite;
        }

        /* 画面揺れ */
        @keyframes shakeScreen {
            0%, 100% { transform: translate(0, 0); }
            25% { transform: translate(-7px, 4px); }
            50% { transform: translate(7px, -5px); }
            75% { transform: translate(-5px, -3px); }
        }
        .shake-hit {
            animation: shakeScreen 0.32s ease-out;
        }

        /* 白煙モクモク登場 */
        @keyframes smokePop {
            0%   { transform: scale(0.3); opacity: 0; }
            45%  { transform: scale(1.18); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .smoke-cutin {
            animation: smokePop 0.42s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
    </style>
</head>
<body class="relative w-screen h-[100dvh] overflow-hidden flex flex-col justify-between">

    <!-- iPad / Android タブレット対応・単一オーディオ要素 -->
    <audio id="charVoiceAudio" preload="auto" playsinline class="hidden"></audio>

    <!-- 花火＆紙吹雪エフェクト用キャンバス -->
    <canvas id="fxCanvas" class="fixed inset-0 pointer-events-none z-40"></canvas>

    <!-- ==========================================================
         スタート画面オーバーレイ（ステップ1：にんずう ＆ ステップ2：キャラえらび）
    =========================================================== -->
    <div id="setupOverlay" class="fixed inset-0 z-50 bg-gradient-to-br from-slate-950 via-orange-950/90 to-indigo-950 flex flex-col justify-between p-3 sm:p-5 overflow-hidden">

        <!-- ステップ1：なんにんで あそぶ？ -->
        <div id="setupStep1" class="w-full h-full max-w-5xl mx-auto flex flex-col items-center justify-between py-2 sm:py-4">
            <div class="w-full flex items-center justify-between">
                <a href="../index.html" class="px-3 py-1.5 rounded-2xl bg-stone-800/90 border-2 border-amber-400 text-amber-200 font-black text-xs sm:text-sm flex items-center gap-1.5 active:scale-95">
                    <span>🏠</span><span>ゲーム いちらんへ</span>
                </a>
                <button onclick="toggleSoundMute()" class="sound-toggle-btn px-3 py-1.5 rounded-2xl bg-amber-900/90 border-2 border-amber-400 text-amber-100 font-black text-xs sm:text-sm flex items-center gap-1.5 active:scale-95">
                    <span>🔊</span><span>おと オン</span>
                </button>
            </div>

            <div class="text-center">
                <div class="inline-block bg-gradient-to-r from-yellow-300 via-amber-400 to-orange-500 text-black font-black text-xs sm:text-base px-5 py-1 rounded-full shadow-lg mb-2">
                    🍥 ナルト しっぷうでん ボードゲーム 🎲
                </div>
                <h1 class="text-3xl sm:text-5xl md:text-6xl font-black text-transparent bg-clip-text bg-gradient-to-b from-yellow-200 via-orange-400 to-red-500 drop-shadow-[0_4px_12px_rgba(255,107,0,0.6)]">
                    にんかい すごろく だいぼうけん！
                </h1>
                <p class="mt-3 sm:mt-4 text-xl sm:text-3xl font-black text-white text-outline">
                    🙌 なんにんで あそぶ？
                </p>
            </div>

            <!-- 2にん 〜 6にん 特大ボタン -->
            <div id="countButtonsRow" class="w-full grid grid-cols-5 gap-2.5 sm:gap-4 max-w-4xl my-2">
                <!-- JSで2〜6にんボタンを描画（初期選択：3にん） -->
            </div>

            <button onclick="goToCharSelectStep()" class="px-10 py-3.5 sm:py-4 rounded-3xl font-black text-xl sm:text-2xl text-black bg-gradient-to-r from-yellow-300 via-amber-400 to-orange-400 border-4 border-white shadow-[0_0_30px_rgba(251,191,36,0.9)] active:scale-95 transition flex items-center gap-3">
                <span>✨ つぎへ！ すきな キャラを えらぼう！</span>
                <span>➡️</span>
            </button>
        </div>

        <!-- ステップ2：ワクワクの キャラクター えらび -->
        <div id="setupStep2" class="hidden w-full h-full max-w-6xl mx-auto flex flex-col justify-between gap-2 overflow-hidden">
            <!-- 上部ナビ＋案内 -->
            <div class="flex items-center justify-between gap-2 shrink-0">
                <button onclick="backToStep1()" class="px-3 py-1.5 rounded-2xl bg-stone-800 hover:bg-stone-700 border-2 border-stone-500 text-stone-200 font-black text-xs sm:text-sm active:scale-95">
                    ◀ にんずうを かえる
                </button>
                <div id="charSelectPrompt" class="text-base sm:text-2xl font-black text-yellow-300 text-outline text-center truncate">
                    👇 1P の キャラを タッチして えらんでね！
                </div>
                <button id="startAdventureBtn" onclick="startBoardGame()" disabled class="px-5 py-2 rounded-2xl font-black text-sm sm:text-lg bg-stone-700 text-stone-400 border-2 border-stone-500 transition flex items-center gap-1.5 shrink-0">
                    <span>🚀 ぼうけん スタート！</span>
                </button>
            </div>

            <!-- 参加プレイヤー枠 (1P〜最大6P) -->
            <div id="setupPlayerSlots" class="grid grid-cols-3 gap-2 shrink-0">
                <!-- JS生成 -->
            </div>

            <!-- 選べる12キャラカードグリッド (6×2 = 12たい) -->
            <div id="setupCharGrid" class="flex-1 min-h-0 grid grid-cols-6 grid-rows-2 gap-2 sm:gap-2.5">
                <!-- JS生成 -->
            </div>
        </div>
    </div>

    <!-- ==========================================================
         メインゲーム画面（100dvh 固定・スクロール一切なし）
    =========================================================== -->
    <!-- 1. 上部プレイヤーステータスバー (12.5dvh) -->
    <header class="relative z-20 h-[12.5dvh] min-h-[68px] max-h-[96px] bg-stone-950/95 border-b-2 border-amber-500/80 px-2 py-1 flex items-center gap-2 shrink-0">
        <!-- 左：ミニ操作ボタン群 -->
        <div class="flex flex-col gap-1 shrink-0">
            <div class="flex items-center gap-1">
                <a href="../index.html" class="w-8 h-7 rounded-lg bg-stone-800 hover:bg-stone-700 border border-amber-400/60 flex items-center justify-center text-sm active:scale-95" title="いちらんへ">🏠</a>
                <button onclick="toggleSoundMute()" class="sound-toggle-btn w-8 h-7 rounded-lg bg-amber-900/90 border border-amber-400 flex items-center justify-center text-sm active:scale-95" title="おと オン/オフ">🔊</button>
            </div>
            <button onclick="confirmRestartToSetup()" class="px-1.5 h-6 rounded-lg bg-red-950 hover:bg-red-900 border border-red-400 text-[10px] font-black text-red-200 active:scale-95">
                🔄 さいしょ
            </button>
        </div>

        <!-- 2〜6人分のプレイヤーステータスカード -->
        <div id="topStatusGrid" class="flex-1 h-full grid grid-cols-3 gap-1.5 sm:gap-2 items-stretch">
            <!-- JS生成 -->
        </div>
    </header>

    <!-- 2. 中央：全45マス（横9×縦5 S字コース）冒険マップ (flex-1 = 約72.5dvh) -->
    <main id="boardStage" class="relative z-10 flex-1 min-h-0 w-full max-w-[1680px] mx-auto px-2 py-1.5 flex flex-col justify-between gap-1 overflow-hidden">
        <!-- 5つのエリア行（このはの さと → しの もり → てんちきょう → しゅうまつの たに → ほかげいわ） -->
        <div id="boardRowsContainer" class="w-full h-full grid grid-rows-5 gap-1 sm:gap-1.5">
            <!-- JSで5行×9列のS字コースを描画 -->
        </div>
    </main>

    <!-- 3. 下部：手裏剣ルーレット ＆ わくわく実況バー (15dvh) -->
    <footer class="relative z-20 h-[15dvh] min-h-[84px] max-h-[116px] bg-gradient-to-r from-stone-950 via-slate-900 to-stone-950 border-t-2 border-amber-500 px-3 py-1.5 flex items-center justify-between gap-3 shrink-0">
        <!-- 左：現在のプレイヤー顔アイコン＋ひらがな実況メッセージ -->
        <div class="flex items-center gap-2.5 min-w-0 flex-1">
            <div id="footerTurnAvatarBox" class="relative w-14 h-14 sm:w-16 sm:h-16 rounded-2xl border-3 border-yellow-300 overflow-hidden shrink-0 shadow-lg bg-stone-800">
                <img id="footerTurnAvatar" src="../bingo/assets/cards/leader_naruto.webp" alt="" class="w-full h-full object-cover object-top">
                <span id="footerTurnBadge" class="absolute bottom-0 inset-x-0 bg-black/80 text-[10px] font-black text-center text-yellow-300">1P</span>
            </div>
            <div class="min-w-0 flex-1">
                <div class="flex items-center gap-2 mb-0.5">
                    <span id="footerTurnNamePill" class="px-2.5 py-0.5 rounded-full text-xs sm:text-sm font-black bg-orange-500 text-white shadow">
                        1P ナルト の ばん！
                    </span>
                    <span id="footerBuffPill" class="hidden px-2.5 py-0.5 rounded-full text-xs font-black bg-yellow-300 text-black animate-bounce">
                        🦊 きゅうび モード！ 4・5・6 かくてい！
                    </span>
                </div>
                <div id="footerMessage" class="text-sm sm:text-xl font-black text-amber-200 text-outline truncate">
                    みぎの ボタンを タッチして しゅりけん ルーレットを まわそう！
                </div>
            </div>
        </div>

        <!-- 右：手裏剣ルーレット（通常1個・かげぶんしん時2個）＋特大スピンボタン -->
        <div class="flex items-center gap-2.5 sm:gap-3 shrink-0">
            <!-- ルーレット表示窓1 -->
            <div id="rouletteBox1" class="relative w-14 h-14 sm:w-18 sm:h-18 rounded-2xl bg-stone-900 border-2 border-amber-400 flex items-center justify-center shadow-inner">
                <div id="shurikenWheel1" class="absolute inset-1 rounded-full border-2 border-dashed border-amber-400/50 pointer-events-none"></div>
                <span id="rouletteNum1" class="relative z-10 text-2xl sm:text-4xl font-black text-yellow-300 text-outline">🎯</span>
            </div>

            <!-- ルーレット表示窓2（かげぶんしん時のみ登場！） -->
            <div id="rouletteBox2" class="hidden relative w-14 h-14 sm:w-18 sm:h-18 rounded-2xl bg-cyan-950 border-2 border-cyan-300 items-center justify-center shadow-inner">
                <div id="shurikenWheel2" class="absolute inset-1 rounded-full border-2 border-dashed border-cyan-300/60 pointer-events-none"></div>
                <span id="rouletteNum2" class="relative z-10 text-2xl sm:text-4xl font-black text-cyan-200 text-outline">👥</span>
            </div>

            <!-- 特大ルーレットボタン -->
            <button id="spinActionBtn" onclick="handleSpinButtonTap()" class="h-14 sm:h-16 px-5 sm:px-8 rounded-2xl font-black text-base sm:text-2xl text-black bg-gradient-to-r from-yellow-300 via-amber-400 to-orange-500 hover:brightness-110 border-4 border-white shadow-[0_0_24px_rgba(251,191,36,0.85)] active:scale-95 transition flex items-center gap-2">
                <span id="spinBtnIcon" class="text-2xl sm:text-3xl">🎯</span>
                <span id="spinBtnLabel">ルーレットを まわす！</span>
            </button>
        </div>
    </footer>

    <!-- ==========================================================
         全画面ワクワクギミック＆ミニゲーム モーダル
    =========================================================== -->
    <div id="gimmickModal" class="hidden fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-3 sm:p-6">
        <div id="gimmickCard" class="smoke-cutin relative w-full max-w-3xl bg-gradient-to-b from-amber-400 via-orange-500 to-red-600 p-1.5 rounded-3xl shadow-[0_0_60px_rgba(255,140,0,0.85)]">
            <div id="gimmickInner" class="bg-stone-950 rounded-[22px] p-4 sm:p-6 text-center relative overflow-hidden">
                <!-- JSで各ギミック（あかつき関門・らせんがん連打・すずとり3択・みんなで対決・いれかえ・くちよせ等）を描画 -->
            </div>
        </div>
    </div>

    <!-- ==========================================================
         🏆 フィナーレ表彰式モーダル（2〜6人全員にキラキラ称号＆キャラボイス！）
    =========================================================== -->
    <div id="finaleModal" class="hidden fixed inset-0 z-50 bg-gradient-to-b from-amber-950/95 via-stone-950/95 to-indigo-950/95 backdrop-blur-md flex flex-col justify-between p-3 sm:p-6 overflow-hidden">
        <div class="text-center shrink-0">
            <div class="inline-block bg-gradient-to-r from-yellow-200 via-amber-400 to-yellow-200 text-black font-black text-xs sm:text-base px-5 py-1 rounded-full shadow-lg animate-bounce">
                🎊 ほかげいわ とうちゃく！ みんな よく がんばったね！！ 🎊
            </div>
            <h2 id="finaleHeadline" class="mt-1 text-2xl sm:text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-200 via-amber-300 to-orange-400">
                🏆 にんかい すごろく ひょうしょうしき 🏆
            </h2>
        </div>

        <!-- 参加メンバー全員の表彰カードグリッド -->
        <div id="finaleAwardsGrid" class="flex-1 min-h-0 max-w-6xl w-full mx-auto my-3 grid grid-cols-3 gap-3 items-stretch">
            <!-- JSで全員分のキラキラ称号バッジ＆キャラボイスボタンを生成 -->
        </div>

        <div class="flex items-center justify-center gap-4 shrink-0">
            <button onclick="playAllFinaleVoices()" class="px-6 py-3 rounded-2xl font-black text-sm sm:text-lg bg-gradient-to-r from-cyan-400 to-blue-500 text-black border-2 border-white shadow-lg active:scale-95">
                🔊 みんなの おいわい ボイスを じゅんばんに きく！
            </button>
            <button onclick="restartFromFinale()" class="px-8 py-3 rounded-2xl font-black text-base sm:text-xl bg-gradient-to-r from-yellow-300 via-amber-400 to-orange-500 text-black border-4 border-white shadow-xl active:scale-95">
                🔄 もういちど あそぶ！
            </button>
        </div>
    </div>

    <!-- リスタート確認ミニモーダル -->
    <div id="restartModal" class="hidden fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
        <div class="bg-stone-900 border-4 border-amber-400 rounded-3xl p-6 max-w-md w-full text-center space-y-4">
            <div class="text-5xl">🔄</div>
            <div class="text-xl sm:text-2xl font-black text-amber-300">さいしょの がめんに もどる？</div>
            <div class="flex items-center gap-3 pt-2">
                <button onclick="closeRestartModal()" class="flex-1 py-3 rounded-2xl bg-stone-700 text-white font-black text-base sm:text-lg">つづける</button>
                <button onclick="doRestartGame()" class="flex-1 py-3 rounded-2xl bg-gradient-to-r from-red-500 to-orange-500 text-white font-black text-base sm:text-lg border-2 border-yellow-200">もどる！</button>
            </div>
        </div>
    </div>

    <script>
        /* ==========================================================
           1. 選べる12にんの 人気キャラクター定義（漢字ゼロ・既存アセット流用）
        ========================================================== */
        const PLAYABLE_CHARS = [
            { id: 'naruto',    name: 'ナルト',     poseTag: '🌀 らせんがん！',     color: '#f97316', ring: 'border-orange-400', bg: 'from-orange-500 to-amber-600', img: '../bingo/assets/cards/leader_naruto.webp',    summonId: 1,  finaleSummonId: 61 },
            { id: 'sasuke',    name: 'サスケ',     poseTag: '⚡ ちどり！',         color: '#8b5cf6', ring: 'border-purple-400', bg: 'from-purple-600 to-indigo-700', img: '../bingo/assets/cards/leader_sasuke.webp',    summonId: 2,  finaleSummonId: 62 },
            { id: 'sakura',    name: 'サクラ',     poseTag: '🌸 しゃーんなろー！', color: '#ec4899', ring: 'border-pink-400',   bg: 'from-pink-500 to-rose-600',     img: '../bingo/assets/cards/leader_sakura.webp',    summonId: 3,  finaleSummonId: 3  },
            { id: 'kakashi',   name: 'カカシ',     poseTag: '⚡ らいきり！',       color: '#0ea5e9', ring: 'border-sky-400',    bg: 'from-sky-500 to-cyan-700',      img: '../bingo/assets/cards/leader_kakashi.webp',   summonId: 4,  finaleSummonId: 68 },
            { id: 'hinata',    name: 'ヒナタ',     poseTag: '🦁 そうしけん！',     color: '#a78bfa', ring: 'border-violet-300', bg: 'from-violet-500 to-purple-700', img: '../bingo/assets/cards/leader_hinata.webp',    summonId: 12, finaleSummonId: 12 },
            { id: 'minato',    name: 'ミナト',     poseTag: '🟨 ひらいしん！',     color: '#eab308', ring: 'border-yellow-300', bg: 'from-yellow-400 to-amber-600',  img: '../bingo/assets/cards/leader_minato.webp',    summonId: 5,  finaleSummonId: 5  },
            { id: 'gaara',     name: 'ガアラ',     poseTag: '🏜️ すなの よろい！', color: '#dc2626', ring: 'border-red-400',    bg: 'from-amber-600 to-red-700',     img: '../bingo/assets/cards/leader_gaara.webp',     summonId: 24, finaleSummonId: 24 },
            { id: 'shikamaru', name: 'シカマル',   poseTag: '🦌 かげまね！',       color: '#10b981', ring: 'border-emerald-400',bg: 'from-emerald-600 to-teal-800',  img: '../bingo/assets/cards/leader_shikamaru.webp', summonId: 10, finaleSummonId: 10 },
            { id: 'itachi',    name: 'イタチ',     poseTag: '🐦‍⬛ アマテラス！',    color: '#e11d48', ring: 'border-rose-500',   bg: 'from-rose-700 to-neutral-900',  img: '../bingo/assets/cards/leader_itachi.webp',    summonId: 31, finaleSummonId: 31 },

        /* ==========================================================
           4. 音声＆効果音エンジン（ビンゴの音声アセットを流用！）
        ========================================================== */
        const voiceEl = document.getElementById('charVoiceAudio');
        let audioCtx = null;
        let audioUnlocked = false;
        let voiceCutTimer = null;

        async function loadBingoAudioManifest() {
            try {
                const res = await fetch('../bingo/assets/audio/manifest.json?v=5');
                if (res.ok) game.audioManifest = await res.json();
            } catch (_) {}
        }

        function unlockAudio() {
            if (audioUnlocked) return;
            audioUnlocked = true;
            getCtx();
            if (voiceEl && !voiceEl.src) {
                voiceEl.src = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
                voiceEl.play().then(() => voiceEl.pause()).catch(() => {});
            }
        }
        window.addEventListener('pointerdown', unlockAudio, { once: true, passive: true });

        function getCtx() {
            if (!audioCtx) {
                const AC = window.AudioContext || window.webkitAudioContext;
                if (AC) audioCtx = new AC();
            }
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function toggleSoundMute() {
            unlockAudio();
            game.soundOn = !game.soundOn;
            if (!game.soundOn && voiceEl) voiceEl.pause();
            document.querySelectorAll('.sound-toggle-btn').forEach(btn => {
                btn.innerHTML = game.soundOn
                    ? (btn.textContent.includes('おと') ? '<span>🔊</span><span>おと オン</span>' : '🔊')
                    : (btn.textContent.includes('おと') ? '<span>🔇</span><span>おと オフ</span>' : '🔇');
            });
        }

        // 既存ビンゴの summon/XX.mp3 の splitSec 以降（キャラ本人の決め台詞部分のみ！）を綺麗に再生
        function playCharacterVoiceBySummonId(summonId, onEndedCallback = null) {
            if (!game.soundOn) {
                if (onEndedCallback) setTimeout(onEndedCallback, 300);
                return;
            }
            if (voiceCutTimer) {
                clearTimeout(voiceCutTimer);
                voiceCutTimer = null;
            }
            const entry = game.audioManifest?.summon?.[String(summonId)];
            const sid = String(summonId).padStart(2, '0');
            const src = entry ? `../bingo/${entry.src}` : `../bingo/assets/audio/summon/${sid}.mp3?v=5`;
            const startSec = entry?.splitSec || 0;

            const startPlay = () => {
                try {
                    if (startSec > 0.05) voiceEl.currentTime = startSec;
                    else voiceEl.currentTime = 0;
                } catch (_) {}
                voiceEl.play().catch(() => {
                    if (onEndedCallback) onEndedCallback();
                });
            };

            voiceEl.onended = () => {
                if (onEndedCallback) onEndedCallback();
            };

            voiceEl.src = src;
            if (startSec > 0.05) {
                voiceEl.addEventListener('loadedmetadata', startPlay, { once: true });
                voiceEl.load();
            } else {
                startPlay();
            }
        }

        // かわいい「ポヨン！」ジャンプ音（1歩ごとに音階が上がる！）
        function playPoyonSound(stepNum = 1) {
            if (!game.soundOn) return;
            const ctx = getCtx();
            if (!ctx) return;
            const scale = [330, 370, 415, 440, 494, 554, 587, 659, 740, 880];
            const baseFreq = scale[(stepNum - 1) % scale.length];
            const now = ctx.currentTime;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(baseFreq * 0.72, now);
            osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.45, now + 0.11);
            osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.15, now + 0.20);
            gain.gain.setValueAtTime(0.30, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.23);
        }

        function playTickSound(high = false) {
            if (!game.soundOn) return;
            const ctx = getCtx();
            if (!ctx) return;
            const now = ctx.currentTime;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(high ? 980 : 680, now);
            gain.gain.setValueAtTime(0.18, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.055);
        }

        function playSmokePuffSound() {
            if (!game.soundOn) return;
            const ctx = getCtx();
            if (!ctx) return;
            const bufferSize = ctx.sampleRate * 0.28;
            const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ctx.sampleRate * 0.08));
            }
            const noise = ctx.createBufferSource();
            noise.buffer = buffer;
            const filter = ctx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(900, ctx.currentTime);
            const gain = ctx.createGain();
            gain.gain.setValueAtTime(0.42, ctx.currentTime);
            noise.connect(filter);
            filter.connect(gain);
            gain.connect(ctx.destination);
            noise.start();
        }

        function playStarChime() {
            if (!game.soundOn) return;
            const ctx = getCtx();
            if (!ctx) return;
            const now = ctx.currentTime;
            [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(f, now + i * 0.065);
                gain.gain.setValueAtTime(0.24, now + i * 0.065);
                gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.065 + 0.24);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now + i * 0.065);
                osc.stop(now + i * 0.065 + 0.25);
            });
        }

        function playHitPunchSound(combo = 1) {
            if (!game.soundOn) return;
            const ctx = getCtx();
            if (!ctx) return;
            const now = ctx.currentTime;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(220 + combo * 22, now);
            osc.frequency.exponentialRampToValueAtTime(65, now + 0.12);
            gain.gain.setValueAtTime(0.28, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.13);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.14);
        }

        function playVictoryFanfare() {
            if (!game.soundOn) return;
            const ctx = getCtx();
            if (!ctx) return;
            const now = ctx.currentTime;
            const notes = [
                [523.25, 0.0, 0.14], [659.25, 0.13, 0.14], [783.99, 0.26, 0.14],
                [1046.5, 0.40, 0.28], [880.0, 0.70, 0.16], [1046.5, 0.88, 0.60]
            ];
            notes.forEach(([f, d, dur]) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(f, now + d);
                gain.gain.setValueAtTime(0.30, now + d);
                gain.gain.exponentialRampToValueAtTime(0.001, now + d + dur);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now + d);
                osc.stop(now + d + dur + 0.02);
            });
        }

                return {
                    id: idx,
                    label: `${idx + 1}P`,
                    char: ch,
                    tile: 1,
                    stars: 1,
                    kageBunshin: false,
                    clearedGate15: false,
                    clearedGate30: false,
                    bossHp15: 8,
                    bossHp30: 10,
                    eventsCount: 0,
                    luckyScore: 0,
                    totalMoved: 0
                };
            });

            game.turnIdx = 0;
            document.getElementById('setupOverlay').classList.add('hidden');
            buildBoardDOMOnce();
            beginPlayerTurn();
        }

        function buildBoardDOMOnce() {
            const container = document.getElementById('boardRowsContainer');
            container.innerHTML = '';

            for (let r = 0; r < 5; r++) {
                const area = AREAS[r];
                const isRightToLeft = (r % 2 === 1);
                const rowTiles = [];
                for (let c = 0; c < 9; c++) {
                    const tileNum = isRightToLeft ? (r * 9 + (9 - c)) : (r * 9 + c + 1);
                    rowTiles.push(tileNum);
                }

                const rowEl = document.createElement('div');
                rowEl.className = `relative rounded-2xl border px-1.5 py-1 grid grid-cols-9 gap-1 sm:gap-1.5 items-stretch ${area.rowBg}`;

                // エリア名ピル（行の左上に小さくかわいく表示）
                const areaBadge = `<span class="absolute -top-2 left-3 z-20 ${area.badgeBg} text-[9px] sm:text-[10px] font-black px-2 py-0.2 rounded-full shadow border border-white/60 pointer-events-none">${area.name}</span>`;

                const cellsHtml = rowTiles.map(tileNum => {
                    const cellCfg = BOARD_MAP[tileNum];
                    const tInfo = TILE_TYPES[cellCfg.type];

                    // 進行方向ガイド矢印
                    let dirArrow = '';
                    if (tileNum < 45) {
                        if (tileNum % 9 === 0) dirArrow = '▼';
                        else dirArrow = isRightToLeft ? '◀' : '▶';
                    } else {
                        dirArrow = '👑';
                    }

                    return `
                        <div id="tile-${tileNum}" class="relative rounded-xl bg-gradient-to-b ${tInfo.tileBg} border-2 p-0.5 sm:p-1 flex flex-col justify-between overflow-visible shadow-md">
                            <!-- マス番号＋矢印 -->
                            <div class="flex items-center justify-between leading-none pointer-events-none">
                                <span class="bg-black/75 text-white text-[9px] sm:text-[11px] font-black px-1 py-0.2 rounded">${tileNum}</span>
                                <span class="text-[9px] sm:text-[11px] font-black text-yellow-200/90">${dirArrow}</span>
                            </div>

                            <!-- 中央：特大ギミックアイコン＆ひらがなラベル -->
                            <div class="flex flex-col items-center justify-center leading-none my-auto pointer-events-none">
                                <span class="text-lg sm:text-2xl md:text-3xl drop-shadow">${tInfo.icon}</span>
                                <span class="text-[8px] sm:text-[10px] font-black text-white text-outline-sm tracking-tighter mt-0.5">${tInfo.label}</span>
                            </div>

                            <!-- プレイヤーのコマ整列レイヤー（最大6人重ならないグリッド） -->
                            <div id="pieces-on-${tileNum}" class="absolute inset-0 z-20 p-0.5 pointer-events-none flex items-center justify-center"></div>
                        </div>
                    `;
                }).join('');

                rowEl.innerHTML = areaBadge + cellsHtml;
                container.appendChild(rowEl);
            }
        }

        function getPlayerRanks() {
            const sorted = [...game.players].sort((a, b) => (b.tile * 100 + b.stars) - (a.tile * 100 + a.stars));
            const rankMap = {};
            sorted.forEach((p, i) => { rankMap[p.id] = i + 1; });
            return rankMap;
        }

        function renderTopStatusAndPieces() {
            const n = game.players.length;
            const statusGrid = document.getElementById('topStatusGrid');
            statusGrid.className = `flex-1 h-full grid grid-cols-${n} gap-1.5 sm:gap-2 items-stretch`;
            const ranks = getPlayerRanks();

            statusGrid.innerHTML = game.players.map((p, idx) => {
                const isTurn = idx === game.turnIdx && game.phase !== 'finale';
                const isKyuubi = isTurn && game.currentKyuubiMode;

                return `
                    <div class="relative rounded-xl px-2 py-1 border-2 flex items-center gap-1.5 sm:gap-2 overflow-hidden transition ${
                        isTurn ? 'border-yellow-300 turn-card-active' : 'border-stone-700 opacity-90'
                    } ${isKyuubi ? 'kyuubi-aura' : ''}" style="background: linear-gradient(135deg, ${p.char.color}cc, #18181b);">
                        <div class="relative w-10 h-10 sm:w-12 sm:h-12 rounded-xl border-2 border-white overflow-hidden shrink-0 bg-stone-900">
                            <img src="${p.char.img}" alt="${p.char.name}" class="w-full h-full object-cover object-top">
                            <span class="absolute top-0 left-0 bg-black/80 text-[8px] sm:text-[9px] font-black px-1 text-yellow-300">${p.label}</span>
                        </div>
                        <div class="min-w-0 flex-1 leading-tight">
                            <div class="flex items-center justify-between gap-1">
                                <span class="text-xs sm:text-sm font-black text-white text-outline-sm truncate">${p.char.name}</span>
                                <span class="text-[9px] sm:text-[11px] font-black bg-black/60 text-yellow-300 px-1.5 rounded-full shrink-0">
                                    ${ranks[p.id] === 1 ? '👑1い' : `${ranks[p.id]}い`}
                                </span>
                            </div>
                            <div class="flex items-center justify-between gap-1 mt-0.5 text-[10px] sm:text-xs font-black">
                                <span class="text-white bg-black/50 px-1.5 rounded">📍${p.tile}マス</span>
                                <span class="text-yellow-300 bg-black/50 px-1.5 rounded">⭐×${p.stars}</span>
                            </div>
                        </div>
                        ${p.kageBunshin ? '<span class="absolute bottom-0.5 right-1 bg-cyan-400 text-black text-[8px] sm:text-[9px] font-black px-1 rounded-full animate-pulse">👥×2</span>' : ''}
                    </div>
                `;
            }).join('');

            // 全45マス上のコマを整列描画（1人＝特大、2人＝横並び、3〜6人＝3×2ミニグリッド）
            for (let t = 1; t <= 45; t++) {
                const holder = document.getElementById(`pieces-on-${t}`);
                if (!holder) continue;
                const here = game.players.filter(p => p.tile === t);
                if (here.length === 0) {
                    holder.innerHTML = '';
                    continue;
                }

                let layoutCls = 'flex items-center justify-center';
                let sizeCls = 'w-9 h-9 sm:w-11 sm:h-11';
                if (here.length === 2) {
                    layoutCls = 'flex items-center justify-center gap-1';
                    sizeCls = 'w-7 h-7 sm:w-8 sm:h-8';
                } else if (here.length >= 3) {
                    layoutCls = 'grid grid-cols-3 gap-0.5 place-items-center w-full h-full p-0.5';
                    sizeCls = 'w-5 h-5 sm:w-6 sm:h-6';
                }

                holder.className = `absolute inset-0 z-20 pointer-events-none ${layoutCls}`;
                holder.innerHTML = here.map(p => {
                    const isHopping = game.hoppingPlayerId === p.id;
                    const isCurrent = p.id === game.turnIdx;
                    const hopBadge = (isHopping && game.hopCountDisplay !== null)
                        ? `<div class="absolute -top-6 left-1/2 -translate-x-1/2 bg-yellow-300 text-black font-black text-xs sm:text-base px-2 py-0.2 rounded-full border-2 border-black shadow-lg whitespace-nowrap z-50">${game.hopCountDisplay}！</div>`
                        : '';

                    return `
                        <div class="relative ${sizeCls} rounded-full border-2 shadow-lg transition-transform ${
                            isHopping ? 'token-hopping scale-115' : ''
                        } ${isCurrent ? 'ring-2 ring-yellow-300 z-30' : ''}" style="border-color:${p.char.color}; background:${p.char.color};">
                            ${hopBadge}
                            <img src="${p.char.img}" alt="${p.char.name}" class="w-full h-full rounded-full object-cover object-top">
                            <span class="absolute -bottom-1 -right-1 bg-black text-white text-[7px] sm:text-[8px] font-black px-1 rounded-full border border-white leading-none">${p.label}</span>
                            ${p.kageBunshin ? '<span class="absolute -top-1 -left-1 text-[10px]">👥</span>' : ''}
                        </div>
                    `;
                }).join('');
            }
        }

        /* ==========================================================
           7. ターン進行 ＆ きゅうびチャクラ解放アシスト ＆ ルーレット
        ========================================================== */
        function beginPlayerTurn() {
            const p = game.players[game.turnIdx];
            game.phase = 'ready_spin';

            // 🦊 きゅうびチャクラ解放モード判定：トップと7マス以上離れていたら自動発動！
            const maxTile = Math.max(...game.players.map(x => x.tile));
            game.currentKyuubiMode = (maxTile - p.tile >= 7);

            // フッターUI更新
            document.getElementById('footerTurnAvatar').src = p.char.img;
            document.getElementById('footerTurnBadge').textContent = p.label;
            const pill = document.getElementById('footerTurnNamePill');
            pill.textContent = `${p.label} ${p.char.name} の ばん！`;
            pill.style.backgroundColor = p.char.color;

            const buffPill = document.getElementById('footerBuffPill');
            if (game.currentKyuubiMode && p.kageBunshin) {
                buffPill.textContent = '🦊きゅうび ＆ 👥ぶんしん モード！！';
                buffPill.classList.remove('hidden');
            } else if (game.currentKyuubiMode) {
                buffPill.textContent = '🦊 きゅうび モード！ 4・5・6 かくてい！';
                buffPill.classList.remove('hidden');
            } else if (p.kageBunshin) {
                buffPill.textContent = '👥 かげぶんしん！ ルーレット 2こ！';
                buffPill.classList.remove('hidden');
            } else {
                buffPill.classList.add('hidden');
            }

            // ルーレット窓1・窓2表示
            const box1 = document.getElementById('rouletteBox1');
            const box2 = document.getElementById('rouletteBox2');
            document.getElementById('rouletteNum1').textContent = game.currentKyuubiMode ? '🦊' : '🎯';
            box1.className = `relative w-14 h-14 sm:w-16 sm:h-16 rounded-2xl border-3 flex items-center justify-center shadow-inner ${
                game.currentKyuubiMode ? 'bg-amber-900 border-yellow-300 kyuubi-aura' : 'bg-stone-900 border-amber-400'
            }`;

            if (p.kageBunshin) {
                box2.classList.remove('hidden');
                box2.classList.add('flex');
                document.getElementById('rouletteNum2').textContent = '👥';
            } else {
                box2.classList.add('hidden');
                box2.classList.remove('flex');
            }

            const spinBtn = document.getElementById('spinActionBtn');
            spinBtn.disabled = false;
            document.getElementById('spinBtnIcon').textContent = '🎯';
            document.getElementById('spinBtnLabel').textContent = 'ルーレットを まわす！';

            setFooterMessage(`🎯 ${p.char.name} の ばんだよ！ ルーレットを タッチしてね！`);
            renderTopStatusAndPieces();

            // きゅうびチャクラ解放演出カットイン！
            if (game.currentKyuubiMode) {
                showQuickBannerCutin(
                    '🦊 きゅうび チャクラ かいほう！！',
                    `${p.char.name} に クラマの ちから！ でめが かならず「4・5・6」に なるよ！`,
                    '../bingo/assets/cards/char_50.webp',
                    50
                );
            }
        }

        function setFooterMessage(msg) {
            document.getElementById('footerMessage').textContent = msg;
        }

        function showQuickBannerCutin(title, desc, imgSrc, summonVoiceId = null) {
            const modal = document.getElementById('gimmickModal');
            const inner = document.getElementById('gimmickInner');
            inner.innerHTML = `
                <div class="flex flex-col items-center gap-3 py-2">
                    <img src="${imgSrc}" alt="" class="w-28 h-28 sm:w-32 sm:h-32 rounded-3xl object-cover object-top border-4 border-yellow-300 shadow-2xl">
                    <div class="text-2xl sm:text-4xl font-black text-yellow-300 text-outline">${title}</div>
                    <div class="text-base sm:text-xl font-black text-white">${desc}</div>
                </div>
            `;
            modal.classList.remove('hidden');
            playStarChime();
            if (summonVoiceId) playCharacterVoiceBySummonId(summonVoiceId);
            setTimeout(() => {
                if (game.phase === 'ready_spin') modal.classList.add('hidden');
            }, 2000);
        }

        function handleSpinButtonTap() {
            unlockAudio();
            if (game.phase === 'ready_spin') {
                startSpinningRoulette();
            } else if (game.phase === 'spinning') {
                finalizeRouletteStop();
            }
        }

        function startSpinningRoulette() {
            game.phase = 'spinning';
            document.getElementById('gimmickModal').classList.add('hidden');
            const p = game.players[game.turnIdx];
            const pool = game.currentKyuubiMode ? [4, 5, 6] : [1, 2, 3, 4, 5, 6];

            document.getElementById('shurikenWheel1').classList.add('shuriken-spinning');
            if (p.kageBunshin) document.getElementById('shurikenWheel2').classList.add('shuriken-spinning');

            document.getElementById('spinBtnIcon').textContent = '⚡';
            document.getElementById('spinBtnLabel').textContent = 'ストップ！！';
            setFooterMessage('🌀 ぐるぐる まわってるよ！ タッチで ストップ！');

            let tickToggle = false;
            game.rouletteTimer = setInterval(() => {
                tickToggle = !tickToggle;
                playTickSound(tickToggle);
                const r1 = pool[Math.floor(Math.random() * pool.length)];
                document.getElementById('rouletteNum1').textContent = r1;
                if (p.kageBunshin) {
                    const r2 = pool[Math.floor(Math.random() * pool.length)];
                    document.getElementById('rouletteNum2').textContent = r2;
                }
            }, 65);

            // 小さなお子さまが1回タッチしただけでも自動で気持ちよく止まるサポートタイマー (1.25秒)
            game.autoStopTimer = setTimeout(() => {
                if (game.phase === 'spinning') finalizeRouletteStop();
            }, 1250);
        }

        function finalizeRouletteStop() {
            if (game.phase !== 'spinning') return;
            game.phase = 'moving';

            if (game.rouletteTimer) { clearInterval(game.rouletteTimer); game.rouletteTimer = null; }
            if (game.autoStopTimer) { clearTimeout(game.autoStopTimer); game.autoStopTimer = null; }

            document.getElementById('shurikenWheel1').classList.remove('shuriken-spinning');
            document.getElementById('shurikenWheel2').classList.remove('shuriken-spinning');

            const p = game.players[game.turnIdx];
            const pool = game.currentKyuubiMode ? [4, 5, 6] : [1, 2, 3, 4, 5, 6];
            const roll1 = pool[Math.floor(Math.random() * pool.length)];
            const roll2 = p.kageBunshin ? pool[Math.floor(Math.random() * pool.length)] : 0;
            const totalSteps = roll1 + roll2;

            document.getElementById('rouletteNum1').textContent = roll1;
            if (p.kageBunshin) {
                document.getElementById('rouletteNum2').textContent = roll2;
                p.kageBunshin = false; // 分身ボーナス消費
            }

            if (totalSteps >= 6) p.luckyScore += 2;
            else if (roll1 >= 5) p.luckyScore += 1;

            const spinBtn = document.getElementById('spinActionBtn');
            spinBtn.disabled = true;
            document.getElementById('spinBtnIcon').textContent = '✨';
            document.getElementById('spinBtnLabel').textContent = `${totalSteps} すすむ！`;

            playStarChime();
            setFooterMessage(
                roll2 > 0
                    ? `✨ ${roll1} と ${roll2} で ごうけい「${totalSteps}」！ いっしょに かぞえよう！`
                    : `✨「${totalSteps}」が でたよ！ いっしょに かぞえよう！`
            );

            setTimeout(() => {
                hopPlayerSteps(p, totalSteps, 1, true);
            }, 520);
        }

        /* ==========================================================
           8. 1マスずつ「ポヨン！ポヨン！」ジャンプ移動（ボス関門ストップ対応）
        ========================================================== */
        function hopPlayerSteps(player, stepsRemaining, dir = 1, triggerTileEventAfter = true) {
            if (stepsRemaining <= 0) {
                game.hoppingPlayerId = null;
                game.hopCountDisplay = null;
                renderTopStatusAndPieces();
                if (player.tile >= 45) {
                    triggerGrandFinale(player);
                } else if (triggerTileEventAfter) {
                    setTimeout(() => triggerLandedTileGimmick(player), 320);
                } else {
                    setTimeout(() => advanceToNextTurn(), 500);
                }
                return;
            }

            const totalPlanned = (player._hopStepIdx || 0) + 1;
            player._hopStepIdx = totalPlanned;

            const nextTile = Math.max(1, Math.min(45, player.tile + dir));
            player.tile = nextTile;
            if (dir > 0) player.totalMoved += 1;

            game.hoppingPlayerId = player.id;
            game.hopCountDisplay = totalPlanned;
            playPoyonSound(totalPlanned);
            renderTopStatusAndPieces();

            // ゴール到達チェック
            if (player.tile >= 45) {
                player._hopStepIdx = 0;
                setTimeout(() => {
                    game.hoppingPlayerId = null;
                    game.hopCountDisplay = null;
                    renderTopStatusAndPieces();
                    triggerGrandFinale(player);
                }, 420);
                return;
            }

            // ☁️ 15マス目＆30マス目「あかつき ボスかんもん」強制ストップ判定！
            if (dir > 0 && player.tile === 15 && !player.clearedGate15) {
                player._hopStepIdx = 0;
                setFooterMessage('☁️ ストップ！！ 15マスめの あかつき ボスかんもん だ！！');
                setTimeout(() => {
                    game.hoppingPlayerId = null;
                    game.hopCountDisplay = null;
                    renderTopStatusAndPieces();
                    openAkatsukiBossGate(player, 15);
                }, 480);
                return;
            }
            if (dir > 0 && player.tile === 30 && !player.clearedGate30) {
                player._hopStepIdx = 0;
                setFooterMessage('☁️ ストップ！！ 30マスめの あかつき ボスかんもん だ！！');
                setTimeout(() => {
                    game.hoppingPlayerId = null;
                    game.hopCountDisplay = null;
                    renderTopStatusAndPieces();
                    openAkatsukiBossGate(player, 30);
                }, 480);
                return;
            }

            setTimeout(() => {
                if (stepsRemaining - 1 <= 0) player._hopStepIdx = 0;
                hopPlayerSteps(player, stepsRemaining - 1, dir, triggerTileEventAfter);
            }, 370);
        }

        function advanceToNextTurn() {
            document.getElementById('gimmickModal').classList.add('hidden');
            game.turnIdx = (game.turnIdx + 1) % game.players.length;
            beginPlayerTurn();
        }

        /* ==========================================================
           9. 全10種類の超ド派手「ワクワクギミック」実装！
        ========================================================== */
        function triggerLandedTileGimmick(player) {
            game.phase = 'event';
            const cell = BOARD_MAP[player.tile];
            if (!cell) { advanceToNextTurn(); return; }

            switch (cell.type) {
                case 'star1':
                    awardStarSimple(player, 1);
                    break;
                case 'star2':
                    awardStarSimple(player, 2);
                    break;
                case 'boss1':
                    if (!player.clearedGate15) openAkatsukiBossGate(player, 15);
                    else awardStarSimple(player, 1);
                    break;
                case 'boss2':
                    if (!player.clearedGate30) openAkatsukiBossGate(player, 30);
                    else awardStarSimple(player, 1);
                    break;
                case 'rasengan':
                    player.eventsCount++;
                    openRasenganMashEvent(player);
                    break;
                case 'bell':
                    player.eventsCount++;
                    openKakashiBellEvent(player);
                    break;
                case 'coop':
                    player.eventsCount++;
                    openCoopShurikenEvent(player);
                    break;
                case 'swap':
                    player.eventsCount++;
                    openKawarimiSwapEvent(player);
                    break;
                case 'kuchiyose':
                    player.eventsCount++;
                    openKuchiyoseShortcutEvent(player, cell);
                    break;
                case 'bunshin':
                    player.eventsCount++;
                    openKageBunshinEvent(player);
                    break;
                case 'ramen':
                    player.eventsCount++;
                    openIchirakuRamenEvent(player);
                    break;
                case 'smoke':
                    openSmokeBombEvent(player, cell.back || 1);
                    break;
                default:
                    advanceToNextTurn();
                    break;
            }
        }

        // ⭐ スター獲得
        function awardStarSimple(player, count) {
            player.stars += count;
            playStarChime();
            spawnConfettiBurst(22);
            renderTopStatusAndPieces();
            setFooterMessage(`⭐ やったね！ チャクラスターを ${count} こ ゲットしたよ！`);
            setTimeout(() => advanceToNextTurn(), 1150);
        }

        // 1. ☁️ あかつき ボスかんもん（15マス目ペイン / 30マス目マダラ）
        function openAkatsukiBossGate(player, gateTile) {
            game.phase = 'event';
            player.eventsCount++;
            const cell = BOARD_MAP[gateTile];
            const isGate15 = gateTile === 15;
            const maxHp = isGate15 ? 8 : 10;
            let hp = isGate15 ? player.bossHp15 : player.bossHp30;

            const modal = document.getElementById('gimmickModal');
            const inner = document.getElementById('gimmickInner');
            modal.classList.remove('hidden');
            playCharacterVoiceBySummonId(cell.bossSummonId);

            let finished = false;
            let timeLeft = 7.0;

            function renderBossUI() {
                const pct = Math.max(0, Math.round((hp / maxHp) * 100));
                inner.innerHTML = `
                    <div class="space-y-3">
                        <div class="inline-block bg-red-600 text-white font-black text-xs sm:text-sm px-4 py-1 rounded-full animate-pulse">
                            ☁️ あかつき ボスかんもん バトル！！（のこり ${timeLeft.toFixed(1)} びょう）
                        </div>
                        <div class="flex items-center justify-center gap-4">
                            <img id="bossAvatarImg" src="${cell.bossImg}" alt="${cell.bossName}" class="w-24 h-24 sm:w-32 sm:h-32 rounded-3xl object-cover object-top border-4 border-red-500 shadow-[0_0_28px_rgba(239,68,68,0.9)]">
                            <div class="text-left flex-1 max-w-xs">
                                <div class="text-xl sm:text-3xl font-black text-red-400 text-outline">${cell.bossName}</div>
                                <div class="text-xs sm:text-sm font-bold text-stone-300 mb-1">あと ${hp} かい タッチして たおそう！</div>
                                <div class="w-full h-5 bg-stone-800 rounded-full overflow-hidden border-2 border-red-400">
                                    <div class="h-full bg-gradient-to-r from-red-600 via-orange-500 to-yellow-400 transition-all duration-100" style="width:${pct}%"></div>
                                </div>
                            </div>
                        </div>
                        <button id="bossAttackBtn" class="w-full py-5 rounded-3xl font-black text-2xl sm:text-3xl text-black bg-gradient-to-r from-yellow-300 via-orange-400 to-red-500 border-4 border-white shadow-[0_0_30px_rgba(251,191,36,0.95)] active:scale-95">
                            👊 れんだで チャクラ アタック！！
                        </button>
                    </div>
                `;
                document.getElementById('bossAttackBtn').onpointerdown = () => {
                    if (finished) return;
                    hp = Math.max(0, hp - 1);
                    playHitPunchSound(maxHp - hp);
                    const bImg = document.getElementById('bossAvatarImg');
                    if (bImg) { bImg.classList.remove('shake-hit'); void bImg.offsetWidth; bImg.classList.add('shake-hit'); }
                    if (hp <= 0) {
                        finishBossBattle(true);
                    } else {
                        renderBossUI();
                    }
                };
            }

            const timer = setInterval(() => {
                if (finished) return;
                timeLeft = Math.max(0, timeLeft - 0.1);
                if (timeLeft <= 0) {
                    finishBossBattle(hp <= 0);
                } else {
                    renderBossUI();
                }
            }, 100);

            function finishBossBattle(won) {
                if (finished) return;
                finished = true;
                clearInterval(timer);

                if (won) {
                    if (isGate15) player.clearedGate15 = true;

        // 4. 🤝 全員参加！「ごうかめっきゃく・みんなで たいけつマス」
        function openCoopShurikenEvent() {
            const modal = document.getElementById('gimmickModal');
            const inner = document.getElementById('gimmickInner');
            modal.classList.remove('hidden');

            const totalTargets = 10;
            let broken = 0;
            let timeLeft = 6.5;
            let ended = false;

            const targets = Array.from({ length: totalTargets }, (_, i) => ({
                id: i,
                hit: false,
                emoji: i % 2 === 0 ? '🎯' : '🔥'
            }));

            function renderCoopArena() {
                inner.innerHTML = `
                    <div class="space-y-2.5">
                        <div class="inline-block bg-pink-500 text-white font-black text-xs sm:text-base px-4 py-1 rounded-full">

                        </div>
                        <div class="text-lg sm:text-2xl font-black text-yellow-300">
                            こわした かず：${broken} / ${totalTargets} こ
                        </div>
                        <div class="grid grid-cols-5 gap-2.5 py-2">
                            ${targets.map(t => `
                                <button data-tid="${t.id}" class="coop-target-btn h-16 sm:h-20 rounded-2xl border-3 flex items-center justify-center text-3xl sm:text-4xl transition ${
                                    t.hit
                                        ? 'bg-stone-900 border-stone-800 opacity-25 scale-75'
                                        : 'bg-gradient-to-br from-red-500 via-orange-500 to-amber-400 border-white shadow-lg active:scale-90'
                                }">
                                    ${t.hit ? '💥' : t.emoji}
                                </button>
                            `).join('')}
                        </div>
                    </div>
                `;
                inner.querySelectorAll('.coop-target-btn').forEach(btn => {
                    btn.onpointerdown = (e) => {
                        e.preventDefault();
                        if (ended) return;
                        const tid = Number(btn.getAttribute('data-tid'));
                        if (!targets[tid].hit) {
                            targets[tid].hit = true;
                            broken++;
                            playHitPunchSound(broken);
                            if (broken >= totalTargets) finishCoop(true);
                            else renderCoopArena();
                        }
                    };
                });
            }

            const timer = setInterval(() => {
                if (ended) return;
                timeLeft = Math.max(0, timeLeft - 0.1);
                if (timeLeft <= 0) finishCoop(broken >= totalTargets);
                else renderCoopArena();
            }, 100);

            function finishCoop(perfect) {
                if (ended) return;
                ended = true;
                clearInterval(timer);
                const reward = perfect ? 2 : 1;
                game.players.forEach(p => { p.stars += reward; p.eventsCount++; });
                playVictoryFanfare();
                spawnConfettiBurst(60);
                renderTopStatusAndPieces();

                inner.innerHTML = `
                    <div class="py-5 space-y-3">
                        <div class="text-6xl">🎊🤝⭐</div>
                        <div class="text-2xl sm:text-4xl font-black text-yellow-300 text-outline">

                        </div>
                        <div class="text-lg sm:text-2xl font-black text-white">
                            ぜんいんに チャクラスター ⭐×${reward} プレゼント！！
                        </div>
                    </div>
                `;
                setTimeout(() => advanceToNextTurn(), 2100);
            }

            renderCoopArena();
        }

                                </div>
                            </div>

                            <button onclick="playCharacterVoiceBySummonId(${p.char.finaleSummonId})" class="w-full py-1.5 rounded-xl font-black text-xs sm:text-sm text-white border border-white/50 active:scale-95" style="background:${p.char.color}">
                                🔊 ${p.char.name} の ボイスを きく！
                            </button>
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('finaleModal').classList.remove('hidden');

            // 優勝キャラのお祝い決め台詞ボイスを自動再生！
            setTimeout(() => {
                playCharacterVoiceBySummonId(goalPlayer.char.finaleSummonId);
            }, 650);
        }

        function playAllFinaleVoices() {
            unlockAudio();
            let i = 0;
            const list = [...game.players];
            function nextVoice() {
                if (i >= list.length || game.phase !== 'finale') return;
                const p = list[i++];
                spawnConfettiBurst(25);
                playCharacterVoiceBySummonId(p.char.finaleSummonId, () => {
                    setTimeout(nextVoice, 350);
                });
            }
            nextVoice();
        }

        function restartFromFinale() {
            document.getElementById('finaleModal').classList.add('hidden');
            doRestartGame();
        }

        function confirmRestartToSetup() {
            document.getElementById('restartModal').classList.remove('hidden');
        }
        function closeRestartModal() {
            document.getElementById('restartModal').classList.add('hidden');
        }
        function doRestartGame() {
            closeRestartModal();
            if (voiceEl) voiceEl.pause();
            game.phase = 'setup';
            document.getElementById('setupOverlay').classList.remove('hidden');
            backToStep1();
        }

        /* ==========================================================
           11. 花火＆紙吹雪エフェクトキャンバス
        ========================================================== */
        const fxCanvas = document.getElementById('fxCanvas');
        const fxCtx = fxCanvas.getContext('2d');
        let confetti = [];

        function resizeFxCanvas() {
            fxCanvas.width = window.innerWidth;
            fxCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeFxCanvas);

        function spawnConfettiBurst(count = 40) {
            const colors = ['#fde047', '#fb923c', '#f43f5e', '#38bdf8', '#a78bfa', '#34d399'];
            for (let i = 0; i < count; i++) {
                confetti.push({
                    x: window.innerWidth * (0.2 + Math.random() * 0.6),
                    y: window.innerHeight * (0.2 + Math.random() * 0.35),
                    vx: (Math.random() - 0.5) * 11,
                    vy: -Math.random() * 9 - 2,
                    size: Math.random() * 8 + 5,
                    rot: Math.random() * Math.PI * 2,
                    vrot: (Math.random() - 0.5) * 0.25,
                    alpha: 1,
                    color: colors[Math.floor(Math.random() * colors.length)]
                });
            }
        }

        function animateFx() {
            fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
            for (let i = confetti.length - 1; i >= 0; i--) {
                const c = confetti[i];
                c.x += c.vx;
                c.y += c.vy;
                c.vy += 0.22;
                c.rot += c.vrot;
                c.alpha -= 0.012;
                if (c.alpha <= 0 || c.y > fxCanvas.height + 30) {
                    confetti.splice(i, 1);
                    continue;
                }
                fxCtx.save();
                fxCtx.globalAlpha = c.alpha;
                fxCtx.translate(c.x, c.y);
                fxCtx.rotate(c.rot);
                fxCtx.fillStyle = c.color;
                fxCtx.fillRect(-c.size / 2, -c.size / 2, c.size, c.size * 0.65);
                fxCtx.restore();
            }
            requestAnimationFrame(animateFx);
        }

        window.addEventListener('DOMContentLoaded', async () => {
            resizeFxCanvas();
            renderStep1CountButtons();
            animateFx();
            await loadBingoAudioManifest();
        });
    </script>
</body>
</html>
